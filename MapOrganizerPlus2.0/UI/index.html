<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MPO2+</title>

    <link rel="stylesheet"
          href="./css/style.css">

</head>

<body>

    <header Plus 2+
        </h1>

    </header>

    <main>

        <section id="mapSection">

            <h2>Mapa</h2>

            <select id="cmbMaps">

                <option>
                    Carregando mapas...
                </option>

            </select>

        </section>

        <hr>

        <section id="actionsSection">

            <h2>Ações</h2>

            <button id="btnPreview">

                Preview

            </button>

            <button id="btnLayout">

                Layout

            </button>

            <button id="btnFixedElements">

                Elementos Fixos

            </button>

            <button id="btnApply">

                Aplicar

            </button>

        </section>

        <hr>

        <section id="statusSection">

            <h2>Status</h2>

            <div id="statusMessage">

                MPO2+ iniciado.

            </div>

        </section>

        <hr>

        <section id="layoutSection">

            <h2>Layout</h2>

            <div id="layoutContainer">

            </div>

        </section>

        <hr>

        <section id="fixedElementsSection">

            <h2>Elementos Fixos</h2>

            <div id="fixedElementsContainer">

            </div>

        </section>

        <hr>

        <section id="previewSection">

            <h2>Preview</h2>

            <div id="previewContainer">

            </div>

        </section>

    </main>

    <script src="./js/main.js"></script>

</body>

</html>
